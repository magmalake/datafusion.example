name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: the committed lock files are written by 0.78.0, and an
          # unpinned pixi rejects them as not up-to-date with the workspace.
          pixi-version: v0.78.0

      # The Mojo bridge is built from the working trees of the other magmalake
      # repos, which are not here. Check them out beside this one so the
      # include paths in mojo/pixi.toml resolve.
      - name: Check out the Mojo read stack
        run: |
          cd ..
          for repo in iceberg.mojo parquet.mojo arrow-mlake.mojo memory-region.mojo avro.mojo deflate.mojo \
                      thrift.mojo zstd.mojo snappy.mojo lz4.mojo brotli.mojo \
                      hashes.mojo roaring.mojo objectstore.mojo threads.mojo; do
            git clone --quiet --depth 1 https://github.com/magmalake/$repo.git
          done

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Build the bridge, then the oracle tests against a PyIceberg fixture
        run: pixi run test
